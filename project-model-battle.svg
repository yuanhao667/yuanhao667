<svg xmlns="http://www.w3.org/2000/svg" width="600" height="356" viewBox="0 0 600 356" role="img" aria-labelledby="title"><title id="title">Model Battle — 查看项目 ↗</title><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif}</style><rect x="1" y="1" width="598" height="354" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><text x="24" y="58" font-size="28" font-weight="650" fill="#1f2328">02 / Model Battle</text><text x="24" y="109" font-size="22" font-weight="600" fill="#1f2328">同一个任务，看看不同模型怎么做。</text><text x="24" y="162" font-size="22" font-weight="400" fill="#1f2328">在 Mac 上并行调用多个模型，对照输出、</text><text x="24" y="194" font-size="22" font-weight="400" fill="#1f2328">耗时与 Token 用量。支持文本、图片、</text><text x="24" y="226" font-size="22" font-weight="400" fill="#1f2328">音频和视频任务。</text><text x="24" y="278" font-size="18" font-weight="400" fill="#59636e">Apple Silicon · 多模型对比 · 多模态</text><text x="24" y="327" font-size="22" fill="#0969da" text-decoration="underline">查看项目 ↗</text></svg>