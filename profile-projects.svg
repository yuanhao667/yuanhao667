<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title"><title id="title">精选作品：Prompt Studio、Model Battle、WearCue、Codex Skills</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}</style><defs><clipPath id="round"><rect x="1" y="1" width="1198" height="618" rx="12"/></clipPath></defs><g clip-path="url(#round)"><rect width="1200" height="620" fill="#ffffff"/><rect x="0" y="310" width="1200" height="310" fill="#f6f8fa"/><path d="M600 0V620 M0 310H1200" stroke="#d1d9e0" stroke-width="1.5"/><text x="24" y="58" font-size="28" font-weight="650" fill="#1f2328">01 / Prompt Studio</text><text x="24" y="109" font-size="22" font-weight="600" fill="#1f2328">给 Prompt 一个认真工作的地方。</text><text x="24" y="162" font-size="22" font-weight="400" fill="#1f2328">原生 macOS Prompt 工作台。结构化编辑、</text><text x="24" y="194" font-size="22" font-weight="400" fill="#1f2328">AI 参考稿并排对照、版本回溯，让每一次</text><text x="24" y="226" font-size="22" font-weight="400" fill="#1f2328">修改都有迹可循。</text><text x="24" y="278" font-size="18" font-weight="400" fill="#59636e">macOS · Prompt 编辑 · 版本管理</text><text x="624" y="58" font-size="28" font-weight="650" fill="#1f2328">02 / Model Battle</text><text x="624" y="109" font-size="22" font-weight="600" fill="#1f2328">同一个任务，看看不同模型怎么做。</text><text x="624" y="162" font-size="22" font-weight="400" fill="#1f2328">在 Mac 上并行调用多个模型，对照输出、</text><text x="624" y="194" font-size="22" font-weight="400" fill="#1f2328">耗时与 Token 用量。支持文本、图片、</text><text x="624" y="226" font-size="22" font-weight="400" fill="#1f2328">音频和视频任务。</text><text x="624" y="278" font-size="18" font-weight="400" fill="#59636e">Apple Silicon · 多模型对比 · 多模态</text><text x="24" y="368" font-size="28" font-weight="650" fill="#1f2328">03 / WearCue</text><text x="24" y="419" font-size="22" font-weight="600" fill="#1f2328">每天少想一件事，穿什么。</text><text x="24" y="472" font-size="22" font-weight="400" fill="#1f2328">结合天气与出行场景的 AI 穿搭助手。</text><text x="24" y="504" font-size="22" font-weight="400" fill="#1f2328">保存自己的穿搭灵感，把今天的天气</text><text x="24" y="536" font-size="22" font-weight="400" fill="#1f2328">变成可以照着穿的建议。</text><text x="24" y="588" font-size="18" font-weight="400" fill="#59636e">AI 生活应用 · 天气穿搭 · 邀请制体验</text><text x="624" y="368" font-size="28" font-weight="650" fill="#1f2328">04 / Codex Skills</text><text x="624" y="419" font-size="22" font-weight="600" fill="#1f2328">把反复做的工作，整理成可复用的方法。</text><text x="624" y="472" font-size="22" font-weight="400" fill="#1f2328">面向产品、写作、AI 评测与文档整理的</text><text x="624" y="504" font-size="22" font-weight="400" fill="#1f2328">Skills。每个都有明确的适用场景，</text><text x="624" y="536" font-size="22" font-weight="400" fill="#1f2328">可以按需独立安装。</text><text x="624" y="588" font-size="18" font-weight="400" fill="#59636e">Agent Skills · 产品工作流 · 内容创作</text></g><rect x="1" y="1" width="1198" height="618" rx="12" fill="none" stroke="#d1d9e0" stroke-width="1.5"/></svg>