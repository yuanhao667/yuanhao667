<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="238" viewBox="0 0 1200 238" role="img" aria-labelledby="title"><title id="title">我如何工作：产品判断、原型与构建、知识沉淀</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}</style><defs><clipPath id="round"><rect x="1" y="1" width="1198" height="236" rx="12"/></clipPath></defs><g clip-path="url(#round)"><rect width="1200" height="238" fill="#ffffff"/><rect x="0" y="184" width="1200" height="54" fill="#f6f8fa"/><path d="M400 0V238 M800 0V238 M0 56H1200 M0 184H1200" stroke="#d1d9e0" stroke-width="1.5"/><text x="18" y="37" font-size="23" font-weight="650" fill="#1f2328">产品判断</text><text x="18" y="94" font-size="21" font-weight="400" fill="#1f2328">从用户任务和使用场景出发，</text><text x="18" y="126" font-size="21" font-weight="400" fill="#1f2328">明确产品要解决的问题，</text><text x="18" y="158" font-size="21" font-weight="400" fill="#1f2328">再用评测检查实际效果。</text><text x="18" y="218" font-size="19" font-weight="400" fill="#59636e">PRD · 产品分析 · 评测助手</text><text x="418" y="37" font-size="23" font-weight="650" fill="#1f2328">原型与构建</text><text x="418" y="94" font-size="21" font-weight="400" fill="#1f2328">把需求与交互做成可操作的</text><text x="418" y="126" font-size="21" font-weight="400" fill="#1f2328">原型和工具，通过真实使用</text><text x="418" y="158" font-size="21" font-weight="400" fill="#1f2328">发现问题、持续修改。</text><text x="418" y="218" font-size="19" font-weight="400" fill="#59636e">Figma · Codex · Prompt Studio</text><text x="818" y="37" font-size="23" font-weight="650" fill="#1f2328">知识沉淀</text><text x="818" y="94" font-size="21" font-weight="400" fill="#1f2328">把分析、写作与复盘整理成文档，</text><text x="818" y="126" font-size="21" font-weight="400" fill="#1f2328">让反复验证过的方法成为</text><text x="818" y="158" font-size="21" font-weight="400" fill="#1f2328">可复用的 Skills。</text><text x="818" y="218" font-size="19" font-weight="400" fill="#59636e">飞书 · Notion · Markdown · Skills</text></g><rect x="1" y="1" width="1198" height="236" rx="12" fill="none" stroke="#d1d9e0" stroke-width="1.5"/></svg>