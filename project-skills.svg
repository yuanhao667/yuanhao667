<svg xmlns="http://www.w3.org/2000/svg" width="600" height="356" viewBox="0 0 600 356" role="img" aria-labelledby="title"><title id="title">Codex Skills — 浏览 Skills ↗</title><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif}</style><rect x="1" y="1" width="598" height="354" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="24" y="58" font-size="28" font-weight="650" fill="#1f2328">04 / Codex Skills</text><text x="24" y="109" font-size="22" font-weight="600" fill="#1f2328">把反复做的工作，整理成可复用的方法。</text><text x="24" y="162" font-size="22" font-weight="400" fill="#1f2328">面向产品、写作、AI 评测与文档整理的</text><text x="24" y="194" font-size="22" font-weight="400" fill="#1f2328">Skills。每个都有明确的适用场景，</text><text x="24" y="226" font-size="22" font-weight="400" fill="#1f2328">可以按需独立安装。</text><text x="24" y="278" font-size="18" font-weight="400" fill="#59636e">Agent Skills · 产品工作流 · 内容创作</text><text x="24" y="327" font-size="22" fill="#0969da" text-decoration="underline">浏览 Skills ↗</text></svg>