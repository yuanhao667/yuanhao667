<svg xmlns="http://www.w3.org/2000/svg" width="600" height="356" viewBox="0 0 600 356" role="img" aria-labelledby="title"><title id="title">Prompt Studio — 查看项目 ↗</title><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif}</style><rect x="1" y="1" width="598" height="354" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><text x="24" y="58" font-size="28" font-weight="650" fill="#1f2328">01 / Prompt Studio</text><text x="24" y="109" font-size="22" font-weight="600" fill="#1f2328">给 Prompt 一个认真工作的地方。</text><text x="24" y="162" font-size="22" font-weight="400" fill="#1f2328">原生 macOS Prompt 工作台。结构化编辑、</text><text x="24" y="194" font-size="22" font-weight="400" fill="#1f2328">AI 参考稿并排对照、版本回溯，让每一次</text><text x="24" y="226" font-size="22" font-weight="400" fill="#1f2328">修改都有迹可循。</text><text x="24" y="278" font-size="18" font-weight="400" fill="#59636e">macOS · Prompt 编辑 · 版本管理</text><text x="24" y="327" font-size="22" fill="#0969da" text-decoration="underline">查看项目 ↗</text></svg>