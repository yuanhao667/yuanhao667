<svg xmlns="http://www.w3.org/2000/svg" width="600" height="356" viewBox="0 0 600 356" role="img" aria-labelledby="title"><title id="title">WearCue — 查看项目 ↗</title><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif}</style><rect x="1" y="1" width="598" height="354" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="24" y="58" font-size="28" font-weight="650" fill="#1f2328">03 / WearCue</text><text x="24" y="109" font-size="22" font-weight="600" fill="#1f2328">每天少想一件事，穿什么。</text><text x="24" y="162" font-size="22" font-weight="400" fill="#1f2328">结合天气与出行场景的 AI 穿搭助手。</text><text x="24" y="194" font-size="22" font-weight="400" fill="#1f2328">保存自己的穿搭灵感，把今天的天气</text><text x="24" y="226" font-size="22" font-weight="400" fill="#1f2328">变成可以照着穿的建议。</text><text x="24" y="278" font-size="18" font-weight="400" fill="#59636e">AI 生活应用 · 天气穿搭 · 邀请制体验</text><text x="24" y="327" font-size="22" fill="#0969da" text-decoration="underline">查看项目 ↗</text></svg>